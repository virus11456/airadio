<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Claudio · 7x24 AI Radio</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="data:," />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0a0a;
      --fg: #e8e8e8;
      --muted: #888;
      --accent: #ff8c42;
      --accent-2: #c264c5;
      --accent-3: #4eb8d9;
      --panel: #141414;
      --line: #1f1f1f;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang TC", "Microsoft JhengHei", sans-serif; -webkit-font-smoothing: antialiased; }
    body { display: flex; flex-direction: column; }

    nav {
      display: flex; gap: 0; border-bottom: 1px solid var(--line);
      background: var(--panel); position: sticky; top: 0; z-index: 10;
    }
    nav button {
      flex: 1; background: none; color: var(--muted); border: none;
      padding: 14px 8px; font-size: 14px; cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    nav button.active { color: var(--fg); border-bottom-color: var(--accent); }

    main { flex: 1; overflow-y: auto; padding: 20px 20px calc(20px + var(--safe-bottom)); }
    .view { display: none; max-width: 720px; margin: 0 auto; }
    .view.active { display: block; }

    /* ---------- Tap to start overlay ---------- */
    .tap-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: radial-gradient(ellipse at center, #1a0f1f 0%, #050505 70%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px; cursor: pointer; padding: 40px;
    }
    .tap-overlay.hidden { display: none; }
    .tap-overlay .logo {
      width: 120px; height: 120px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex; align-items: center; justify-content: center;
      font-size: 64px; color: #000;
      box-shadow: 0 0 80px rgba(255,140,66,0.4);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 80px rgba(255,140,66,0.4); }
      50% { transform: scale(1.05); box-shadow: 0 0 120px rgba(255,140,66,0.6); }
    }
    .tap-overlay h1 { font-size: 28px; font-weight: 600; margin: 0; letter-spacing: 0.04em; }
    .tap-overlay p { color: var(--muted); font-size: 14px; margin: 0; text-align: center; max-width: 280px; line-height: 1.6; }
    .tap-overlay .hint { color: var(--accent); font-size: 13px; margin-top: 16px; letter-spacing: 0.1em; }

    /* ---------- Player ---------- */
    .cover {
      width: 100%; aspect-ratio: 1;
      background:
        radial-gradient(ellipse at 30% 20%, rgba(194,100,197,0.3), transparent 50%),
        radial-gradient(ellipse at 70% 80%, rgba(78,184,217,0.25), transparent 60%),
        linear-gradient(135deg, #2a1810, #0f0a07);
      border-radius: 16px; position: relative; overflow: hidden;
      margin-bottom: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .cover::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.6));
    }
    .cover-content {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      justify-content: flex-end; padding: 24px; z-index: 1;
    }
    .cover-mark {
      position: absolute; top: 24px; left: 24px; font-size: 12px;
      letter-spacing: 0.2em; color: var(--accent); opacity: 0.8;
    }
    .cover-mark::before {
      content: ''; display: inline-block; width: 6px; height: 6px;
      border-radius: 50%; background: var(--accent); margin-right: 8px;
      box-shadow: 0 0 8px var(--accent); vertical-align: middle;
      animation: blink 2s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .cover .title-big {
      font-size: clamp(22px, 5vw, 32px); font-weight: 600; line-height: 1.2;
      margin-bottom: 6px; word-break: break-word;
    }
    .cover .artist-big {
      font-size: 14px; color: rgba(255,255,255,0.7);
    }
    .cover .empty-mark {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 96px; color: var(--accent); opacity: 0.3;
    }

    .dj-line {
      background: var(--panel); border-left: 3px solid var(--accent);
      padding: 14px 16px; margin: 16px 0; border-radius: 0 8px 8px 0;
      font-size: 14px; line-height: 1.7; color: #ddd;
      min-height: 24px; transition: border-color 0.3s;
    }
    .dj-line.speaking { border-left-color: var(--accent-2); background: linear-gradient(90deg, rgba(194,100,197,0.1), var(--panel)); }
    .dj-line:empty::before { content: "（DJ 還在沉澱中）"; color: var(--muted); }

    .controls {
      display: flex; justify-content: center; gap: 16px; margin: 16px 0;
    }
    .controls button {
      background: var(--panel); color: var(--fg); border: 1px solid var(--line);
      border-radius: 999px; padding: 10px 20px; font-size: 16px; cursor: pointer;
      min-width: 56px;
      transition: all 0.15s;
    }
    .controls button:hover { border-color: var(--accent); }
    .controls button:active { transform: scale(0.95); }
    .controls #btn-toggle { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }

    .lyrics {
      margin: 16px 0; padding: 12px 16px;
      background: var(--panel); border-radius: 8px;
      font-size: 13px; line-height: 1.8; color: #bbb;
      white-space: pre-wrap; max-height: 200px; overflow-y: auto;
      display: none;
    }
    .lyrics.show { display: block; }
    .lyrics-toggle {
      font-size: 12px; color: var(--muted); cursor: pointer;
      text-align: center; margin: -8px 0 8px; user-select: none;
    }
    .lyrics-toggle:hover { color: var(--accent); }

    .queue { margin-top: 24px; }
    .queue h3 { font-size: 13px; color: var(--muted); margin: 0 0 8px; text-transform: uppercase; letter-spacing: 0.06em; }
    .queue-item {
      padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 14px;
      display: flex; gap: 8px; align-items: center;
    }
    .queue-item .kind { color: var(--muted); width: 30px; flex-shrink: 0; font-size: 12px; }
    .queue-item.dj .kind { color: var(--accent-2); }

    /* ---------- Chat ---------- */
    .chat {
      display: flex; gap: 8px; margin-top: 16px;
    }
    .chat input {
      flex: 1; background: var(--panel); color: var(--fg); border: 1px solid var(--line);
      border-radius: 8px; padding: 10px 12px; font-size: 14px;
    }
    .chat input:focus { outline: none; border-color: var(--accent); }
    .chat button {
      background: var(--accent); color: #000; border: none;
      border-radius: 8px; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
    }

    /* ---------- Profile ---------- */
    .field { margin-bottom: 20px; }
    .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.06em; }
    .field textarea {
      width: 100%; min-height: 200px; background: var(--panel); color: var(--fg);
      border: 1px solid var(--line); border-radius: 8px; padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; line-height: 1.5;
      resize: vertical;
    }
    .field button {
      background: var(--accent); color: #000; border: none;
      border-radius: 8px; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
      margin-top: 8px;
    }

    /* ---------- Settings ---------- */
    .row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .row label { font-size: 14px; }
    .row .ctl input[type=range] { width: 200px; }
    .status { font-size: 12px; color: var(--muted); margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); }

    /* ---------- Player status pill (always visible) ---------- */
    .pill-wrap { display: flex; justify-content: center; margin-bottom: 12px; }
    .pill {
      font-size: 11px; padding: 4px 10px; border-radius: 999px;
      background: var(--panel); border: 1px solid var(--line); color: var(--muted);
      letter-spacing: 0.06em;
    }
    .pill.ok { color: #6fcf97; border-color: rgba(111,207,151,0.3); }
    .pill.warn { color: var(--accent); border-color: rgba(255,140,66,0.4); }
    .pill.err { color: #ff6b6b; border-color: rgba(255,107,107,0.4); }
  </style>
</head>
<body>
  <div class="tap-overlay" id="tap-overlay">
    <div class="logo">♪</div>
    <h1>Claudio</h1>
    <p>你的 24 小時 AI 電台。<br>點一下任何地方開始收聽。</p>
    <div class="hint">TAP TO START</div>
  </div>

  <nav>
    <button data-view="player" class="active">Player</button>
    <button data-view="profile">Profile</button>
    <button data-view="settings">Settings</button>
  </nav>

  <main>
    <section class="view active" id="view-player">
      <div class="pill-wrap"><span class="pill" id="pill-status">connecting…</span></div>
      <div class="cover" id="cover">
        <div class="cover-mark">ON AIR</div>
        <div class="empty-mark" id="cover-empty">♪</div>
        <div class="cover-content">
          <div class="title-big" id="now-title"></div>
          <div class="artist-big" id="now-artist"></div>
        </div>
      </div>
      <div class="dj-line" id="dj-line"></div>
      <div class="controls">
        <button id="btn-prev" title="重播">↶</button>
        <button id="btn-toggle">▶︎</button>
        <button id="btn-skip">⏭</button>
      </div>
      <div class="lyrics-toggle" id="lyrics-toggle">▾ 顯示歌詞</div>
      <div class="lyrics" id="lyrics"></div>
      <div class="chat">
        <input id="chat-input" placeholder="跟 Claudio 說點什麼…（例：放點 city pop）" />
        <button id="chat-send">送</button>
      </div>
      <div class="queue">
        <h3>下一首</h3>
        <div id="queue-list"></div>
      </div>
      <audio id="audio" preload="auto" playsinline></audio>
    </section>

    <section class="view" id="view-profile">
      <div class="field">
        <label>taste.md（音樂品味）</label>
        <textarea id="profile-taste"></textarea>
      </div>
      <div class="field">
        <label>routines.md（作息）</label>
        <textarea id="profile-routines"></textarea>
      </div>
      <div class="field">
        <label>mood-rules.md（心情規則）</label>
        <textarea id="profile-mood"></textarea>
      </div>
      <div class="field">
        <label>playlists.json（種子歌單）</label>
        <textarea id="profile-playlists"></textarea>
      </div>
      <button id="profile-save">儲存</button>
    </section>

    <section class="view" id="view-settings">
      <div class="row">
        <label>音量</label>
        <div class="ctl"><input type="range" id="set-volume" min="0" max="100" value="80" /></div>
      </div>
      <div class="row">
        <label>DJ 播報</label>
        <div class="ctl"><input type="checkbox" id="set-dj" checked /></div>
      </div>
      <div class="row">
        <label>聲線</label>
        <div class="ctl">
          <select id="set-voice">
            <option value="default">預設</option>
          </select>
        </div>
      </div>
      <div class="status" id="status">connecting…</div>
    </section>
  </main>

  <script src="/app.js" type="module"></script>
</body>
</html>
